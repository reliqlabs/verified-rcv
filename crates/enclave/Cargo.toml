[package]
name = "verified-rcv-enclave"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Runtime wrapper for verified-rcv enclave — wires Tally_spec core to dstack TDX + Quartz attestation"

[features]
# Default: no real zkdcap gnark prover. The runtime produces synthetic
# `(proof, public_inputs)` matching the v0.3.9 §2.5 byte layout — used by
# tests + dev. When `real-zkdcap` is on, the runtime connects to the
# zkdcap Go prover via unix socket (see /Users/mvid/Development/reliq/zkdcap/host/src/gnark.rs).
default = []
real-zkdcap = []

[lib]
name = "verified_rcv_enclave"
path = "src/lib.rs"

[[bin]]
name = "verified-rcv-enclave"
path = "src/main.rs"

[[bin]]
name = "verified-rcv-roundtrip"
path = "src/bin/roundtrip.rs"

[[bin]]
name = "verified-rcv-enclave-server"
path = "src/bin/server.rs"

[[bin]]
name = "verified-rcv-smoke"
path = "src/bin/smoke.rs"

[dependencies]
verified-rcv-enclave-core = { path = "../enclave-core", features = ["serialize"] }

serde.workspace = true
serde_json.workspace = true
hex.workspace = true
thiserror.workspace = true

# Crypto primitives (ECIES decrypt via the same crate the Quartz example uses).
ecies = { version = "0.2", default-features = false, features = ["pure", "std"] }
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "alloc"] }

# Roundtrip test binary deps. Borsh pin matches the UI's borsh-js choice;
# canonical_serialization per intent §2.5.
borsh = { version = "1.5", features = ["std", "derive"] }
clap = { version = "4", features = ["derive"] }

# gRPC server stack (Phase 1 per docs/runtime-integration.md).
tonic = "0.12"
prost = "0.13"
async-trait = "0.1"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Attestation envelope deps (Phase 3). reqwest is async (matches oauth3's
# dstack client pattern: native unix_socket support on the async builder).
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
urlencoding = "2"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "time", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }
# Cross-test (tests/cross_canonical.rs) verifies the contract's and
# runtime's canonical_serialization produce byte-identical bytes. Use the
# `library` feature so the contract builds as a lib (no entry_point macros).
verified-rcv-contract = { path = "../contract", features = ["library"] }
# Cross-test calls into the contract's compute_ballots_hash, which takes
# cosmwasm-std Addr + HexBinary directly. v0.3.11 B6.
cosmwasm-std = { workspace = true, features = ["std"] }
