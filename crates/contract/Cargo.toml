[package]
name = "verified-rcv-contract"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "CosmWasm contract for verified-rcv (ranked-choice voting with TDX-attested tally)"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Production default: NO mock attestation, NO dev-only paths reachable.
# Audit finding C1 (2026-05-26): Mock must be compile-time excluded from
# production wasm. Tests / dev builds opt in via `mock-attestation`.
default = []

# Mock attestation gate. When OFF (production), AttestationEnvelope::Mock
# does not exist at all — the enum has only the Dstack variant and the
# contract's match is exhaustive over real attestation.
mock-attestation = []

# Library mode: skip the entry_point macros so this crate can be imported
# from tests and external tools.
library = []

# Kani / Verus harnesses live behind `verification` feature so they don't
# bloat the wasm output.
verification = ["mock-attestation"]

[dependencies]
cosmwasm-std = { workspace = true, features = ["std", "exports", "stargate", "cosmwasm_2_0"] }
cosmwasm-schema.workspace = true
cw-storage-plus.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hex.workspace = true
# SHA-256 for the attestation commit-hash check (intent §3.2 B8(c) / B8(e)).
# canonical_serialization is hand-rolled to match intent §2.5 v0.3.1 T7
# byte-for-byte; see `contract::canonical_serialization`.
sha2 = "0.10"
# Shared canonical UltraHonk attestation layer (packed public_inputs layout +
# decoders + the Xion ProofVerifyUltraHonk backend). One place for the proof
# checks across dossier / verified-rcv; a circuit/layout bump is a rev bump.
quartz-zkdcap = { git = "ssh://git@github.com/reliqlabs/quartz.git", rev = "ba9e2b968bf03b90909eb15046b9557ecdfce0b4", features = ["xion-backend"] }

# Shared core types with the enclave (TallyResult schema, Ballot, etc.).
verified-rcv-enclave-core = { path = "../enclave-core", features = ["serialize"] }

[dev-dependencies]
cosmwasm-std = { workspace = true, features = ["std", "exports"] }

[lints.rust]
# `kani` is an external cfg consumed by the Kani verifier; declare it
# explicitly so plain rustc (and clippy --features verification) doesn't
# warn about unknown cfg conditions.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
