[package]
name = "verified-rcv-contract"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "CosmWasm contract for verified-rcv (ranked-choice voting with TDX-attested tally)"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
mock = []
library = []
# Kani / Verus harnesses live behind `verification` feature so they don't
# bloat the wasm output.
verification = []

[dependencies]
cosmwasm-std = { workspace = true, features = ["std", "exports"] }
cosmwasm-schema.workspace = true
cw-storage-plus.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hex.workspace = true

# Shared core types with the enclave (TallyResult schema, Ballot, etc.).
verified-rcv-enclave-core = { path = "../enclave-core", features = ["serialize"] }

[dev-dependencies]
cosmwasm-std = { workspace = true, features = ["std", "exports"] }
