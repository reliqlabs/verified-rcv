name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # N5 (v0.3.10) — production-safety CI matrix.
      - name: Build (default features — production-equivalent)
        run: cargo build --workspace
      - name: Test (default features)
        run: cargo test --workspace
      # Verification feature: enables mock-attestation + Kani harness types.
      - name: Test (verification feature)
        run: cargo test -p verified-rcv-contract --features verification
      # Clippy with warnings-as-errors on the default (production) build.
      - name: Clippy (default features, deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # cargo-audit for known CVEs in dependencies.
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: cargo audit
        run: cargo audit --deny warnings
      # Build the production wasm artifact and run cosmwasm-check on it.
      - name: Build wasm contract (release, default features)
        run: cargo build -p verified-rcv-contract --release --target wasm32-unknown-unknown --lib
      - name: Install cosmwasm-check
        run: cargo install --locked cosmwasm-check
      - name: cosmwasm-check wasm artifact
        run: cosmwasm-check target/wasm32-unknown-unknown/release/verified_rcv_contract.wasm
      # Compile-time sanity: ensure the production wasm has no symbols
      # named after the mock-attestation / verification feature paths.
      # If either feature leaked into the default build the rejection
      # is hard (exit 1), per audit Ask Z ("deferred is panic").
      - name: Verify mock-attestation absent from production wasm
        run: |
          set -euo pipefail
          WASM="target/wasm32-unknown-unknown/release/verified_rcv_contract.wasm"
          if strings "$WASM" | grep -qE 'mock_attestation|verification\b'; then
            echo "PRODUCTION WASM CONTAINS mock_attestation/verification SYMBOLS — feature flag leak!"
            exit 1
          fi
          echo "OK: production wasm has no mock_attestation/verification symbols."

  ui:
    name: ui
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack + pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      # The encryption.test.ts spec shells out via execFileSync to
      # `cargo run -p verified-rcv-enclave --bin verified-rcv-roundtrip`,
      # so cargo must be on PATH in this job too.
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ui-${{ hashFiles('**/Cargo.lock') }}

      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  vercel:
    name: vercel-deploy
    runs-on: ubuntu-latest
    # Only deploy from main; PRs get no auto-deploy (preview deploys can be
    # added later if you want them — they'd use `--prebuilt` without `--prod`).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ui
    defaults:
      run:
        working-directory: ui
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack + pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel project config
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build with Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
