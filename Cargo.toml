[workspace]
members = [
    "crates/contract",
    "crates/enclave-core",
    "crates/enclave",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["verified-rcv contributors"]

[workspace.dependencies]
cosmwasm-std = { version = "3", default-features = false, features = ["std"] }
cosmwasm-schema = "3"
cw-storage-plus = "3"
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false }
thiserror = "2"
hex = "0.4"

# Aeneas-extractable IRV core has no external deps beyond serde for ballot
# parsing. Keep this minimal so charon can handle it.

[profile.release]
opt-level = "z"
debug = false
lto = true
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true
